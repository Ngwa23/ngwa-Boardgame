apiVersion: apps/v1
kind: Deployment # Kubernetes resource kind we are creating
metadata:
  name: bgame
spec:
  selector:
    matchLabels:
      app: bgame
  replicas: 2 # Number of replicas that will be created for this deployment
  template:
    metadata:
      labels:
        app: bgame
    spec:
      containers:
        - name: bgame
          image: ngwa23/bgame:v4 # Image that will be used to containers in the cluster
          imagePullPolicy: Always
          ports:
            - containerPort: 8080 # The port that the container is running on in the cluster
---
apiVersion: v1
kind: Service
metadata:
  name: bgamesvc
spec:
  type: NodePort
  selector:
    app: bgame
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30007  # Optional (default: 30000-32767)


